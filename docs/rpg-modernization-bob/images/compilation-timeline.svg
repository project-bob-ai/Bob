<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="'IBM Plex Mono',monospace">
  <rect width="860" height="260" fill="#161616"/>
  <text x="430" y="28" font-size="11" fill="#c8d4f8" text-anchor="middle" font-weight="600">COMPILATION TIMELINE — 3 COMPILE EVENTS</text>

  <!-- Timeline line -->
  <line x1="60" y1="120" x2="800" y2="120" stroke="#393939" stroke-width="2"/>

  <!-- Event 1 -->
  <circle cx="160" cy="120" r="10" fill="#0f62fe"/>
  <text x="160" y="96" font-size="8.5" fill="#78a9ff" text-anchor="middle">Pre-Conversion</text>
  <text x="160" y="107" font-size="8" fill="#a8a8a8" text-anchor="middle">CRTBNDRPG</text>
  <text x="160" y="145" font-size="8" fill="#a8a8a8" text-anchor="middle">STUDRPT_T</text>
  <text x="160" y="158" font-size="8" fill="#42be65" text-anchor="middle">✓ attempt 1</text>
  <text x="160" y="170" font-size="7.5" fill="#525252" text-anchor="middle">06:12:29</text>

  <!-- Event 2 -->
  <circle cx="430" cy="120" r="10" fill="#198038"/>
  <text x="430" y="96" font-size="8.5" fill="#42be65" text-anchor="middle">Post O-Spec Extern.</text>
  <text x="430" y="107" font-size="8" fill="#a8a8a8" text-anchor="middle">CRTBNDRPG</text>
  <text x="430" y="145" font-size="8" fill="#a8a8a8" text-anchor="middle">STUDRPT_T (ext DDS)</text>
  <text x="430" y="158" font-size="8" fill="#f1c21b" text-anchor="middle">✓ attempt 2</text>
  <text x="430" y="170" font-size="7.5" fill="#525252" text-anchor="middle">STUEML length fix</text>

  <!-- Event 3 -->
  <circle cx="700" cy="120" r="10" fill="#198038"/>
  <text x="700" y="96" font-size="8.5" fill="#42be65" text-anchor="middle">Post Free-Format</text>
  <text x="700" y="107" font-size="8" fill="#a8a8a8" text-anchor="middle">CRTBNDRPG</text>
  <text x="700" y="145" font-size="8" fill="#a8a8a8" text-anchor="middle">STUDR_FREE</text>
  <text x="700" y="158" font-size="8" fill="#42be65" text-anchor="middle">✓ attempt 1</text>
  <text x="700" y="170" font-size="7.5" fill="#525252" text-anchor="middle">final output</text>

  <!-- Arrows from timeline -->
  <line x1="160" y1="130" x2="160" y2="140" stroke="#0f62fe" stroke-width="1.5"/>
  <line x1="430" y1="130" x2="430" y2="140" stroke="#198038" stroke-width="1.5"/>
  <line x1="700" y1="130" x2="700" y2="140" stroke="#198038" stroke-width="1.5"/>

  <!-- Tool boxes -->
  <rect x="80" y="195" width="160" height="38" rx="3" fill="#262626" stroke="#393939"/>
  <text x="160" y="210" font-size="8" fill="#a8a8a8" text-anchor="middle">get_compile_actions</text>
  <text x="160" y="223" font-size="8" fill="#78a9ff" text-anchor="middle">execute_compile_action</text>

  <rect x="350" y="195" width="160" height="38" rx="3" fill="#262626" stroke="#393939"/>
  <text x="430" y="210" font-size="8" fill="#a8a8a8" text-anchor="middle">get_compile_actions</text>
  <text x="430" y="223" font-size="8" fill="#78a9ff" text-anchor="middle">execute_compile_action</text>

  <rect x="620" y="195" width="160" height="38" rx="3" fill="#262626" stroke="#393939"/>
  <text x="700" y="210" font-size="8" fill="#a8a8a8" text-anchor="middle">get_compile_actions</text>
  <text x="700" y="223" font-size="8" fill="#78a9ff" text-anchor="middle">execute_compile_action</text>

  <text x="430" y="250" font-size="8.5" fill="#525252" text-anchor="middle">Self-healing loop: compile → check errors → fix → recompile · Max 10 attempts per cycle</text>
